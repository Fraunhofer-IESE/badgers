site_name: Badgers Documentation
site_url: https://github.com/Fraunhofer-IESE/badgers
repo_url: https://github.com/Fraunhofer-IESE/badgers
repo_name: Fraunhofer-IESE/badgers

nav:
    -   Home: index.md
    -   Getting started: getting-started.md
    -   Concepts:
            -   Understanding badgers: tutorials/concepts/Badgers-Concepts.ipynb
    -   Tutorials:
            -   Overview: tutorials/index.md
            -   Tabular Data:
                    -   Generating Outliers: tutorials/tabular-data/Outliers.ipynb
                    -   Generating Noise: tutorials/tabular-data/Noise.ipynb
                    -   Generating Missing Data: tutorials/tabular-data/Missingness.ipynb
                    -   Generating Imbalanced Data: tutorials/tabular-data/Imbalance.ipynb
                    -   Generating Drift: tutorials/tabular-data/Drift.ipynb
            -   Text Data:
                    -   Generating Typos: tutorials/text/Typos-Text.ipynb
            -   Time Series Data:
                    -   Generating Point Outliers: tutorials/time-series/Outliers-Time-Series.ipynb
                    -   Generating Missing Data: tutorials/time-series/Missingness-Time-Series.ipynb
                    -   Generating Noise: tutorials/time-series/Noise-Time-Series.ipynb
                    -   Generating Patterns: tutorials/time-series/Patterns-Time-Series.ipynb
                    -   Generating Trends: tutorials/time-series/Trends-Time-Series.ipynb
                    -   Generating Seasons: tutorials/time-series/Seasons-Time-Series.ipynb
                    -   Generating Changepoints: tutorials/time-series/Changepoints-Time-Series.ipynb
                    -   Generating "Transmissions Errors": tutorials/time-series/Transmission-Errors-Time-Series.ipynb
            -   Pipelines:
                    -   Chaining Generators: tutorials/Pipeline-Tabular-Data.ipynb
    -   Implementing Novel Generators:
            -   Creating Tabular Generators: tutorials/dev/Create-New-Tabular-Generators.ipynb
            -   Creating Selectors: tutorials/dev/Create-New-Selectors.ipynb
            -   Using DGPs: tutorials/dev/Using-DGPs.ipynb
    - Examplary Use Cases:
            -   Impact of deficits on ML predictors: tutorials/use-cases/Impact-of-deficits-on-ML-predictors.ipynb
    -   About: about.md
    -   Changes: changelog.md
    - Architecture:
            - Overview: architecture.md
            - System context: architecture/context.md
            - Building blocks: architecture/building-blocks.md
            - Runtime scenarios: architecture/runtime.md
            - Quality goals: architecture/quality.md
            - Causal defect family: architecture/causal-design.md
            - Decisions:
                    - Index: architecture/adr/index.md
                    - ADR-0001 Tests vs benchmarks: architecture/adr/0001-tests-vs-benchmarks.md
                    - ADR-0002 Per-data-type fixtures: architecture/adr/0002-per-data-type-fixtures.md
                    - ADR-0003 Benchmark auto-registration: architecture/adr/0003-benchmark-auto-registration.md
                    - ADR-0004 Vectorized NumPy: architecture/adr/0004-vectorized-numpy.md
                    - ADR-0005 Baseline regression detection: architecture/adr/0005-baseline-regression-detection.md
                    - ADR-0006 Shared OOD samplers: architecture/adr/0006-shared-ood-samplers.md
                    - ADR-0007 Import contracts: architecture/adr/0007-import-contracts.md
    -   Benchmarking: benchmarking.md
    -   API: reference/

theme:
    name: material
    features:
        - navigation.sections
        - navigation.indexes
        - navigation.instant

plugins:
    - search
    -   gen-files:
            scripts:
                - docs/gen_ref_pages.py
    -   literate-nav:
            nav_file: SUMMARY.md
    -   mkdocstrings:
            handlers:
                python:
                    options:
                        show_source: true
                        docstring_style: sphinx
    - mkdocs-jupyter

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

watch:
    - ../badgers
