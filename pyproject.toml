[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "badgers"
version = "0.1.0"
keywords = ["data quality", "data synthesis", "data science", "causal inference", "machine learning", "bad data"]
authors = [
    { name = "Julien Siebert", email = "julien.siebert@iese.fraunhofer.de" },
]
maintainers = [
    { name = "Julien Siebert", email = "julien.siebert@iese.fraunhofer.de" },
]
description = "Badgers: bad data generators"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Development Status :: 1 - Planning",
]
dependencies = [
    "numpy~=2.4.1",
    "scikit-learn>=1.8,<1.10",
    "networkx~=3.6.1",
    "pandas>=2.3.3,<3.2.0",
    "scipy~=1.17.0",
]
[project.optional-dependencies]
pymc = [
    "pymc>=5.0",
    "pytensor>=2.0",
]
dowhy = [
    "dowhy>=0.13",
]
dev = [
    "tox>=4.34.1,<4.68.0",
    "mkdocs~=1.6.1",
    "mkdocstrings~=1.0.1",
    "mkdocstrings-python~=2.0.1",
    "mkdocs-gen-files~=0.6.0",
    "mkdocs-material>=9.7.1,<9.9.0",
    "mkdocs-literate-nav~=0.6.2",
    "mkdocs-jupyter>=0.25.1,<0.27.0",
    "jupyterlab>=4.5.2,<4.7.0",
    "matplotlib>=3.10.8,<3.12.0",
    "pytest>=9.0.2,<9.3.0",
    "pytest-timeout~=2.4.0",
    "pytest-benchmark>=5.2.3,<5.4.0",
    "flake8>=7.3,<7.6",
    "import-linter>=2.0,<3.0",
]
[project.urls]
"Homepage" = "https://github.com/Fraunhofer-IESE/badgers"
"Bug Tracker" = "https://github.com/Fraunhofer-IESE/badgers/issues"

[tool.flake8]
exclude = [
    ".venv",
    ".tox",
    "site",
    "experiments",
    "uncertainty-main-*",
    "__pycache__",
    ".git",
    ".idea",
    ".vscode",
    "notebooks",
    ".continue",
    "mcp",
    "profiling_tests",
    "benchmarks/results",
    "benchmarks/baselines",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]


[tool.importlinter]
root_package = "badgers"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core must not depend on generators"
type = "forbidden"
source_modules = ["badgers.core"]
forbidden_modules = ["badgers.generators"]

[[tool.importlinter.contracts]]
name = "generators must not import DGP backends"
type = "forbidden"
source_modules = ["badgers.generators"]
forbidden_modules = ["badgers.core.dgp.backends"]

[[tool.importlinter.contracts]]
name = "core.dgp must not import generators"
type = "forbidden"
source_modules = ["badgers.core.dgp"]
forbidden_modules = ["badgers.generators"]

[[tool.importlinter.contracts]]
name = "the library must not import the benchmarks package"
type = "forbidden"
source_modules = ["badgers"]
forbidden_modules = ["benchmarks"]

[[tool.importlinter.contracts]]
name = "Layered architecture: generators -> dgp -> selectors -> utils"
type = "layers"
layers = [
    "badgers.generators",
    "badgers.core.dgp",
    "badgers.core.selectors",
    "badgers.core.utils",
]
